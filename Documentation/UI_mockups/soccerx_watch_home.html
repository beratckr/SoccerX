<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoccerX - Apple Watch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Compact Rounded', 'SF Pro Display', sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Apple Watch Container */
        .watch-container {
            width: 368px;
            height: 448px;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Watch Frame */
        .watch-frame {
            width: 324px;
            height: 394px;
            background: #1a1a1a;
            border-radius: 60px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.5),
                0 10px 40px rgba(0,0,0,0.8);
        }

        /* Digital Crown */
        .digital-crown {
            position: absolute;
            right: -12px;
            top: 120px;
            width: 8px;
            height: 50px;
            background: linear-gradient(to bottom, #666, #444, #666);
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* Side Button */
        .side-button {
            position: absolute;
            right: -10px;
            top: 200px;
            width: 6px;
            height: 35px;
            background: #333;
            border-radius: 3px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* Watch Screen */
        .watch-screen {
            width: 296px;
            height: 368px;
            background: #000;
            border-radius: 50px;
            margin: 13px auto;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Status Bar */
        .status-bar {
            padding: 10px 20px 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #999;
        }

        .time {
            font-weight: 600;
            color: #fff;
        }

        .battery-icon {
            width: 22px;
            height: 12px;
            border: 1px solid #999;
            border-radius: 2px;
            position: relative;
            padding: 1px;
        }

        .battery-fill {
            width: 70%;
            height: 100%;
            background: #2ECC71;
            border-radius: 1px;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 0 20px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* App Header */
        .app-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .app-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #2ECC71 0%, #27AE60 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            margin: 0 auto 8px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .app-title {
            font-size: 16px;
            font-weight: 600;
            color: #fff;
        }

        /* Start Button */
        .start-section {
            text-align: center;
            margin-bottom: 30px;
        }

        .start-button {
            width: 160px;
            height: 160px;
            background: radial-gradient(circle at center, #2ECC71 0%, #27AE60 100%);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(46, 204, 113, 0.3);
            position: relative;
            overflow: hidden;
        }

        .start-button::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shimmer 3s ease-in-out infinite;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }

        .start-button:active {
            transform: scale(0.95);
        }

        .start-icon {
            font-size: 48px;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .start-text {
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
            z-index: 1;
        }

        /* Last Game Summary */
        .last-game {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #2a2a2a;
        }

        .last-game-title {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .last-game-stats {
            display: flex;
            justify-content: space-between;
        }

        .game-stat {
            text-align: center;
        }

        .stat-value {
            font-size: 18px;
            font-weight: 600;
            color: #2ECC71;
            margin-bottom: 2px;
        }

        .stat-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
        }

        /* Quick Actions */
        .quick-actions {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .action-button {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 12px 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .action-button:active {
            background: #2a2a2a;
            transform: scale(0.95);
        }

        .action-icon {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .action-label {
            font-size: 10px;
            color: #999;
        }

        /* Connection Status */
        .connection-status {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #666;
            background: rgba(26, 26, 26, 0.8);
            padding: 4px 12px;
            border-radius: 12px;
            animation: slideUp 0.6s ease-out 0.3s both;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .connection-dot {
            width: 6px;
            height: 6px;
            background: #4CD964;
            border-radius: 50%;
            animation: blink 2s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Complication Preview */
        .complication-preview {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60px;
            height: 60px;
            background: #1a1a1a;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .complication-preview.show {
            opacity: 1;
        }

        /* Loading State */
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #1a1a1a;
            border-top-color: #2ECC71;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 60px auto;
            display: none;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Haptic Feedback Indicator */
        .haptic-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(46, 204, 113, 0.3), transparent);
            opacity: 0;
            pointer-events: none;
        }

        .haptic-indicator.active {
            animation: haptic 0.3s ease-out;
        }

        @keyframes haptic {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.5);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.2);
            }
        }

        /* Always On Display Mode */
        .always-on-mode {
            filter: brightness(0.3);
            transition: filter 0.5s ease;
        }

        .always-on-mode .start-button {
            animation: none;
        }

        .always-on-mode .connection-status,
        .always-on-mode .quick-actions {
            opacity: 0;
        }
    </style>
</head>
<body>
    <div class="watch-container">
        <div class="watch-frame">
            <div class="digital-crown"></div>
            <div class="side-button"></div>
            
            <div class="watch-screen" id="watchScreen">
                <!-- Status Bar -->
                <div class="status-bar">
                    <span class="time">9:41</span>
                    <div class="battery-icon">
                        <div class="battery-fill"></div>
                    </div>
                </div>

                <!-- Main Content -->
                <div class="main-content">
                    <!-- App Header -->
                    <div class="app-header">
                        <div class="app-icon">⚽</div>
                        <h1 class="app-title">SoccerX</h1>
                    </div>

                    <!-- Start Button -->
                    <div class="start-section">
                        <div class="start-button" onclick="startGame()">
                            <span class="start-icon">▶️</span>
                            <span class="start-text">Start</span>
                        </div>
                    </div>

                    <!-- Last Game Summary -->
                    <div class="last-game">
                        <div class="last-game-title">Last Game</div>
                        <div class="last-game-stats">
                            <div class="game-stat">
                                <div class="stat-value">5.2</div>
                                <div class="stat-label">km</div>
                            </div>
                            <div class="game-stat">
                                <div class="stat-value">68</div>
                                <div class="stat-label">min</div>
                            </div>
                            <div class="game-stat">
                                <div class="stat-value">85</div>
                                <div class="stat-label">MVP</div>
                            </div>
                        </div>
                    </div>

                    <!-- Quick Actions -->
                    <div class="quick-actions">
                        <div class="action-button" onclick="viewHistory()">
                            <div class="action-icon">📊</div>
                            <div class="action-label">History</div>
                        </div>
                        <div class="action-button" onclick="viewSettings()">
                            <div class="action-icon">⚙️</div>
                            <div class="action-label">Settings</div>
                        </div>
                    </div>
                </div>

                <!-- Connection Status -->
                <div class="connection-status">
                    <span class="connection-dot"></span>
                    <span>iPhone Connected</span>
                </div>

                <!-- Haptic Feedback Indicator -->
                <div class="haptic-indicator" id="hapticIndicator"></div>

                <!-- Loading Spinner -->
                <div class="loading-spinner" id="loadingSpinner"></div>

                <!-- Complication Preview -->
                <div class="complication-preview" id="complicationPreview">⚽</div>
            </div>
        </div>
    </div>

    <script>
        // Start game
        function startGame() {
            // Haptic feedback
            triggerHaptic();
            
            // Show loading
            const button = document.querySelector('.start-button');
            const spinner = document.getElementById('loadingSpinner');
            const mainContent = document.querySelector('.main-content');
            
            button.style.animation = 'none';
            button.style.transform = 'scale(0.9)';
            
            setTimeout(() => {
                mainContent.style.display = 'none';
                spinner.style.display = 'block';
                
                // Simulate GPS acquisition
                setTimeout(() => {
                    console.log('Starting game tracking...');
                    // In real app, would transition to active game screen
                }, 2000);
            }, 200);
        }

        // View history
        function viewHistory() {
            triggerHaptic();
            console.log('Opening history...');
        }

        // View settings
        function viewSettings() {
            triggerHaptic();
            console.log('Opening settings...');
        }

        // Haptic feedback simulation
        function triggerHaptic() {
            const indicator = document.getElementById('hapticIndicator');
            indicator.classList.add('active');
            
            setTimeout(() => {
                indicator.classList.remove('active');
            }, 300);
        }

        // Digital Crown rotation simulation
        let scrollPosition = 0;
        document.addEventListener('wheel', (e) => {
            scrollPosition += e.deltaY;
            console.log('Digital Crown rotation:', scrollPosition);
            
            // In real app, would handle scrolling/zooming
        });

        // Always-on display simulation
        let isActive = true;
        let inactivityTimer;

        function setAlwaysOnMode(enabled) {
            const screen = document.getElementById('watchScreen');
            if (enabled) {
                screen.classList.add('always-on-mode');
                isActive = false;
            } else {
                screen.classList.remove('always-on-mode');
                isActive = true;
            }
        }

        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            if (!isActive) {
                setAlwaysOnMode(false);
            }
            
            inactivityTimer = setTimeout(() => {
                setAlwaysOnMode(true);
            }, 10000); // 10 seconds of inactivity
        }

        // Track user activity
        document.addEventListener('click', resetInactivityTimer);
        document.addEventListener('touchstart', resetInactivityTimer);
        
        // Initialize inactivity timer
        resetInactivityTimer();

        // Update time
        function updateTime() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = now.getMinutes().toString().padStart(2, '0');
            document.querySelector('.time').textContent = `${hours}:${minutes}`;
        }

        // Update time every minute
        setInterval(updateTime, 60000);
        updateTime();

        // Connection status animation
        let connected = true;
        setInterval(() => {
            const statusText = document.querySelector('.connection-status span:last-child');
            const statusDot = document.querySelector('.connection-dot');
            
            if (connected) {
                statusDot.style.background = '#4CD964';
                statusText.textContent = 'iPhone Connected';
            } else {
                statusDot.style.background = '#FF3B30';
                statusText.textContent = 'iPhone Disconnected';
            }
        }, 5000);

        // Complication long press
        let longPressTimer;
        const startButton = document.querySelector('.start-button');
        const complicationPreview = document.getElementById('complicationPreview');

        startButton.addEventListener('touchstart', () => {
            longPressTimer = setTimeout(() => {
                complicationPreview.classList.add('show');
                triggerHaptic();
            }, 500);
        });

        startButton.addEventListener('touchend', () => {
            clearTimeout(longPressTimer);
            complicationPreview.classList.remove('show');
        });
    </script>
</body>
</html>
