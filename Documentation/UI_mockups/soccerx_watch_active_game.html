<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoccerX - Active Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Compact Rounded', 'SF Pro Display', sans-serif;
            background: #000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* Apple Watch Container */
        .watch-container {
            width: 368px;
            height: 448px;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Watch Frame */
        .watch-frame {
            width: 324px;
            height: 394px;
            background: #1a1a1a;
            border-radius: 60px;
            position: relative;
            overflow: hidden;
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.5),
                0 10px 40px rgba(0,0,0,0.8);
        }

        /* Digital Crown */
        .digital-crown {
            position: absolute;
            right: -12px;
            top: 120px;
            width: 8px;
            height: 50px;
            background: linear-gradient(to bottom, #666, #444, #666);
            border-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* Side Button */
        .side-button {
            position: absolute;
            right: -10px;
            top: 200px;
            width: 6px;
            height: 35px;
            background: #333;
            border-radius: 3px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* Watch Screen */
        .watch-screen {
            width: 296px;
            height: 368px;
            background: #000;
            border-radius: 50px;
            margin: 13px auto;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Status Bar */
        .status-bar {
            padding: 10px 16px 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #999;
            position: relative;
            z-index: 10;
        }

        .workout-icon {
            color: #2ECC71;
            font-size: 14px;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .time {
            font-weight: 600;
            color: #fff;
        }

        /* Main Stats Container */
        .main-stats {
            flex: 1;
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        /* Duration Display */
        .duration-section {
            text-align: center;
            margin-bottom: 20px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .duration-value {
            font-size: 48px;
            font-weight: 300;
            color: #fff;
            letter-spacing: -1px;
            font-variant-numeric: tabular-nums;
        }

        .duration-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-item {
            background: #1a1a1a;
            border-radius: 16px;
            padding: 16px 12px;
            text-align: center;
            border: 1px solid #2a2a2a;
            transition: all 0.3s ease;
            animation: slideIn 0.6s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .stat-item.primary {
            grid-column: span 2;
            background: linear-gradient(135deg, rgba(46, 204, 113, 0.1) 0%, rgba(39, 174, 96, 0.1) 100%);
            border-color: rgba(46, 204, 113, 0.3);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 4px;
            font-variant-numeric: tabular-nums;
        }

        .stat-unit {
            font-size: 14px;
            color: #999;
            font-weight: 400;
        }

        .stat-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Heart Rate Zone Indicator */
        .heart-rate-zone {
            position: absolute;
            top: 10px;
            right: 16px;
            width: 4px;
            height: 40px;
            background: #1a1a1a;
            border-radius: 2px;
            overflow: hidden;
        }

        .zone-fill {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: #FF3B30;
            transition: all 0.3s ease;
            height: 60%;
        }

        .zone-fill.zone-1 { background: #3498DB; height: 20%; }
        .zone-fill.zone-2 { background: #2ECC71; height: 40%; }
        .zone-fill.zone-3 { background: #F39C12; height: 60%; }
        .zone-fill.zone-4 { background: #E74C3C; height: 80%; }
        .zone-fill.zone-5 { background: #9B59B6; height: 100%; }

        /* Control Buttons */
        .controls-section {
            padding: 0 16px 20px;
            display: flex;
            gap: 12px;
        }

        .control-button {
            flex: 1;
            height: 50px;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #fff;
        }

        .control-button:active {
            background: #2a2a2a;
            transform: scale(0.95);
        }

        .control-button.pause {
            background: rgba(255, 159, 10, 0.2);
            border-color: #FF9F0A;
            color: #FF9F0A;
        }

        .control-button.stop {
            background: rgba(255, 59, 48, 0.2);
            border-color: #FF3B30;
            color: #FF3B30;
        }

        /* Swipe Indicator */
        .swipe-indicator {
            position: absolute;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            padding: 4px;
            background: rgba(26, 26, 26, 0.8);
            border-radius: 10px;
            opacity: 0;
            animation: fadeInOut 3s ease-in-out;
        }

        @keyframes fadeInOut {
            0%, 100% { opacity: 0; }
            10%, 90% { opacity: 1; }
        }

        .swipe-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #666;
            transition: all 0.3s ease;
        }

        .swipe-dot.active {
            background: #2ECC71;
            width: 16px;
            border-radius: 3px;
        }

        /* Auto Brightness Overlay */
        .brightness-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0);
            pointer-events: none;
            transition: background 0.5s ease;
        }

        .brightness-overlay.dim {
            background: rgba(0, 0, 0, 0.3);
        }

        /* Speed Indicator */
        .speed-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            opacity: 0;
            pointer-events: none;
        }

        .speed-ring {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px solid rgba(46, 204, 113, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: speedPulse 2s ease-in-out infinite;
        }

        @keyframes speedPulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.1); opacity: 0.6; }
        }

        .speed-indicator.sprinting .speed-ring {
            border-color: rgba(255, 59, 48, 0.5);
            animation-duration: 1s;
        }

        /* Haptic Feedback */
        .haptic-feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(46, 204, 113, 0.4), transparent);
            opacity: 0;
            pointer-events: none;
        }

        .haptic-feedback.active {
            animation: haptic 0.3s ease-out;
        }

        @keyframes haptic {
            0% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(0.8);
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0;
                transform: translate(-50%, -50%) scale(1.2);
            }
        }

        /* Lock Icon */
        .lock-icon {
            position: absolute;
            top: 40px;
            left: 16px;
            font-size: 16px;
            color: #FF9F0A;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .lock-icon.visible {
            opacity: 1;
        }

        /* Water Lock Mode */
        .water-lock-active {
            pointer-events: none;
        }

        .water-lock-active .control-button {
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div class="watch-container">
        <div class="watch-frame">
            <div class="digital-crown"></div>
            <div class="side-button"></div>
            
            <div class="watch-screen" id="watchScreen">
                <!-- Status Bar -->
                <div class="status-bar">
                    <span class="workout-icon">⚽</span>
                    <span class="time">9:43</span>
                </div>

                <!-- Lock Icon -->
                <div class="lock-icon" id="lockIcon">🔒</div>

                <!-- Main Stats -->
                <div class="main-stats">
                    <!-- Duration -->
                    <div class="duration-section">
                        <div class="duration-value" id="duration">12:34</div>
                        <div class="duration-label">Duration</div>
                    </div>

                    <!-- Stats Grid -->
                    <div class="stats-grid">
                        <div class="stat-item primary">
                            <div class="stat-value">1.8 <span class="stat-unit">km</span></div>
                            <div class="stat-label">Distance</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">156</div>
                            <div class="stat-label">Heart Rate</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">18.4</div>
                            <div class="stat-label">Speed km/h</div>
                        </div>
                    </div>

                    <!-- Heart Rate Zone Indicator -->
                    <div class="heart-rate-zone">
                        <div class="zone-fill zone-3" id="zoneIndicator"></div>
                    </div>
                </div>

                <!-- Control Buttons -->
                <div class="controls-section">
                    <button class="control-button pause" onclick="pauseGame()">
                        <span>⏸</span>
                        <span>Pause</span>
                    </button>
                    <button class="control-button stop" onclick="stopGame()">
                        <span>⏹</span>
                        <span>Stop</span>
                    </button>
                </div>

                <!-- Swipe Indicator -->
                <div class="swipe-indicator" id="swipeIndicator">
                    <div class="swipe-dot active"></div>
                    <div class="swipe-dot"></div>
                    <div class="swipe-dot"></div>
                </div>

                <!-- Speed Indicator -->
                <div class="speed-indicator" id="speedIndicator">
                    <div class="speed-ring"></div>
                </div>

                <!-- Brightness Overlay -->
                <div class="brightness-overlay" id="brightnessOverlay"></div>

                <!-- Haptic Feedback -->
                <div class="haptic-feedback" id="hapticFeedback"></div>
            </div>
        </div>
    </div>

    <script>
        // Game state
        let gameStartTime = Date.now();
        let isPaused = false;
        let isLocked = false;
        let currentScreen = 0;
        let currentSpeed = 0;
        let currentHeartRate = 156;

        // Update duration every second
        setInterval(updateDuration, 1000);

        function updateDuration() {
            if (!isPaused) {
                const elapsed = Date.now() - gameStartTime;
                const minutes = Math.floor(elapsed / 60000);
                const seconds = Math.floor((elapsed % 60000) / 1000);
                document.getElementById('duration').textContent = 
                    `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }
        }

        // Simulate real-time stats updates
        setInterval(updateStats, 2000);

        function updateStats() {
            if (!isPaused) {
                // Update distance
                const distanceEl = document.querySelector('.stat-item.primary .stat-value');
                let distance = parseFloat(distanceEl.textContent);
                distance += (Math.random() * 0.05);
                distanceEl.innerHTML = `${distance.toFixed(1)} <span class="stat-unit">km</span>`;

                // Update speed
                const speedEl = document.querySelectorAll('.stat-item')[2].querySelector('.stat-value');
                currentSpeed = 10 + Math.random() * 15;
                speedEl.textContent = currentSpeed.toFixed(1);

                // Check for sprint
                if (currentSpeed > 20) {
                    showSprintIndicator();
                }

                // Update heart rate
                const hrEl = document.querySelectorAll('.stat-item')[1].querySelector('.stat-value');
                currentHeartRate += Math.random() * 10 - 5;
                currentHeartRate = Math.max(120, Math.min(180, currentHeartRate));
                hrEl.textContent = Math.round(currentHeartRate);

                // Update heart rate zone
                updateHeartRateZone(currentHeartRate);
            }
        }

        function updateHeartRateZone(hr) {
            const zoneEl = document.getElementById('zoneIndicator');
            zoneEl.className = 'zone-fill';
            
            if (hr < 120) zoneEl.classList.add('zone-1');
            else if (hr < 140) zoneEl.classList.add('zone-2');
            else if (hr < 160) zoneEl.classList.add('zone-3');
            else if (hr < 175) zoneEl.classList.add('zone-4');
            else zoneEl.classList.add('zone-5');
        }

        function showSprintIndicator() {
            const indicator = document.getElementById('speedIndicator');
            indicator.classList.add('sprinting');
            indicator.style.opacity = '1';
            
            triggerHaptic();
            
            setTimeout(() => {
                indicator.style.opacity = '0';
                indicator.classList.remove('sprinting');
            }, 2000);
        }

        // Control functions
        function pauseGame() {
            if (isLocked) return;
            
            isPaused = true;
            triggerHaptic();
            console.log('Game paused');
            // In real app, would show pause screen
        }

        function stopGame() {
            if (isLocked) return;
            
            // Double tap confirmation
            if (!this.confirmStop) {
                this.confirmStop = true;
                triggerHaptic();
                
                setTimeout(() => {
                    this.confirmStop = false;
                }, 2000);
            } else {
                triggerHaptic();
                triggerHaptic();
                console.log('Game stopped');
                // In real app, would end workout
            }
        }

        // Haptic feedback
        function triggerHaptic() {
            const haptic = document.getElementById('hapticFeedback');
            haptic.classList.remove('active');
            
            setTimeout(() => {
                haptic.classList.add('active');
            }, 10);
        }

        // Swipe between screens
        let touchStartX = 0;
        const watchScreen = document.getElementById('watchScreen');

        watchScreen.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        });

        watchScreen.addEventListener('touchend', (e) => {
            const touchEndX = e.changedTouches[0].clientX;
            const diff = touchEndX - touchStartX;
            
            if (Math.abs(diff) > 50) {
                if (diff > 0) {
                    // Swipe right
                    previousScreen();
                } else {
                    // Swipe left
                    nextScreen();
                }
            }
        });

        function nextScreen() {
            currentScreen = (currentScreen + 1) % 3;
            updateSwipeIndicator();
            triggerHaptic();
            
            // In real app, would show different stat views
            console.log('Screen:', currentScreen);
        }

        function previousScreen() {
            currentScreen = (currentScreen - 1 + 3) % 3;
            updateSwipeIndicator();
            triggerHaptic();
        }

        function updateSwipeIndicator() {
            const dots = document.querySelectorAll('.swipe-dot');
            dots.forEach((dot, index) => {
                dot.classList.toggle('active', index === currentScreen);
            });
            
            // Show indicator briefly
            const indicator = document.getElementById('swipeIndicator');
            indicator.style.animation = 'none';
            setTimeout(() => {
                indicator.style.animation = 'fadeInOut 3s ease-in-out';
            }, 10);
        }

        // Water lock (prevents accidental touches)
        let tapCount = 0;
        let tapTimer;

        document.querySelector('.side-button').addEventListener('click', () => {
            tapCount++;
            
            if (tapCount === 1) {
                tapTimer = setTimeout(() => {
                    tapCount = 0;
                }, 500);
            } else if (tapCount === 2) {
                clearTimeout(tapTimer);
                tapCount = 0;
                toggleWaterLock();
            }
        });

        function toggleWaterLock() {
            isLocked = !isLocked;
            const screen = document.getElementById('watchScreen');
            const lockIcon = document.getElementById('lockIcon');
            
            if (isLocked) {
                screen.classList.add('water-lock-active');
                lockIcon.classList.add('visible');
                triggerHaptic();
            } else {
                screen.classList.remove('water-lock-active');
                lockIcon.classList.remove('visible');
                triggerHaptic();
                triggerHaptic();
            }
        }

        // Auto-brightness based on movement
        let lastMovement = Date.now();
        let dimTimer;

        function resetDimTimer() {
            lastMovement = Date.now();
            const overlay = document.getElementById('brightnessOverlay');
            overlay.classList.remove('dim');
            
            clearTimeout(dimTimer);
            dimTimer = setTimeout(() => {
                overlay.classList.add('dim');
            }, 10000); // Dim after 10 seconds of no movement
        }

        // Simulate movement detection
        document.addEventListener('mousemove', resetDimTimer);
        document.addEventListener('touchstart', resetDimTimer);
        resetDimTimer();

        // Digital Crown for zooming stats
        document.addEventListener('wheel', (e) => {
            e.preventDefault();
            // In real app, would zoom in/out on current stat
            console.log('Digital Crown rotation:', e.deltaY);
        });

        // Show swipe indicator on load
        setTimeout(() => {
            document.getElementById('swipeIndicator').style.opacity = '1';
        }, 1000);
    </script>
</body>
</html>
